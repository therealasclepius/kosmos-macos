unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#111c18,fg=#C1C497'
set -g status-left-length 40
set -g status-right-length 80
set -g status-left '#[fg=#111c18,bg=#509475,bold] #S #[default] '
set -g status-right '#[fg=#53685B]#(whoami) #[fg=#71CEAD]%a %H:%M '
setw -g window-status-format '#[fg=#53685B] #I:#W '
setw -g window-status-current-format '#[fg=#111c18,bg=#71CEAD,bold] #I:#W '
set -g pane-border-style 'fg=#23372B'
set -g pane-active-border-style 'fg=#71CEAD'
