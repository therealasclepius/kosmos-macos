set -g status-style 'bg=#1e2030,fg=#cad3f5'
set -g status-left '#[fg=#24273a,bg=#8aadf4,bold] #S #[default] '
set -g status-right '#[fg=#8087a2]#(whoami) #[fg=#8aadf4]%a %H:%M '
setw -g window-status-format '#[fg=#8087a2] #I:#W '
setw -g window-status-current-format '#[fg=#24273a,bg=#c6a0f6,bold] #I:#W '
set -g pane-border-style 'fg=#494d64'
set -g pane-active-border-style 'fg=#8aadf4'
